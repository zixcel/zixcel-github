[package]
name = "zixcel-github-cli"
version = "0.1.2"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/zixcel/zixcel-github"
description = "Reviewed native github observations through the zix protocol"
publish = false
[[bin]]
name = "zix-github"
path = "src/main.rs"
[dependencies]
zix-native-provider = { git = "https://github.com/zixcel/cli", rev = "c2ee2e9670efe81473bf7067a8efa1944589619e" }
[dev-dependencies]
serde_json = "1.0"
[lints.rust]
unsafe_code = "forbid"
[lints.clippy]
all = "warn"
