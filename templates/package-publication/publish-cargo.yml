name: Publish Rust crate
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: package-publication-${{ github.repository }}
  cancel-in-progress: false
jobs:
  publish:
    if: vars.REGISTRY_PUBLISH_ENABLED == 'true' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: crates-io-public
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require the reviewed source revision
        env:
          APPROVED_SHA: ${{ vars.REGISTRY_SECURITY_APPROVED_SHA }}
        run: |
          test "$APPROVED_SHA" = "$GITHUB_SHA"
          git merge-base --is-ancestor HEAD origin/main
      - name: Check registry metadata and release tag
        env:
          RELEASE_TAG_PREFIX: ${{ vars.REGISTRY_CARGO_TAG_PREFIX || 'v' }}
        run: |
          python3 scripts/check-public-package.py cargo
          VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml","rb"))["package"]["version"])')
          test "$GITHUB_REF_TYPE" = tag
          test "$GITHUB_REF_NAME" = "${RELEASE_TAG_PREFIX}${VERSION}"
          TOOLCHAIN=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml","rb"))["package"]["rust-version"])')
          rustup toolchain install "$TOOLCHAIN" --profile minimal
          rustup override set "$TOOLCHAIN"
      - name: Test and verify the package against crates.io
        run: |
          cargo test --locked --all-features
          cargo package --locked
          PACKAGE=$(python3 -c 'import tomllib; p=tomllib.load(open("Cargo.toml","rb"))["package"]; print(p["name"]+"-"+p["version"]+".crate")')
          python3 scripts/check-public-package.py cargo --archive "target/package/$PACKAGE"
          cargo publish --dry-run --locked --registry crates-io
      - name: Obtain the scoped short-lived crates.io token
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish the verified source through OIDC
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked --registry crates-io
