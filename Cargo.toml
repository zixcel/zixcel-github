[package]
categories = ["api-bindings", "command-line-utilities"]
keywords = ["ai-agents", "llm", "github-api", "cli", "automation"]
exclude = ["*.tgz", "**/*.tgz", "/registration/**", "/state/**", "/.local/**", "/.state/**", "/.data/**", "/secrets/**", "/credentials/**", "/.env", "/.env.production", "/.env.local", "/*.tgz", "/*.tar.gz", "/*.tar", "/*.zip", "/*.whl", "/*.crate", "/.ruff_cache/**", "/.mypy_cache/**", "/.tox/**", "/.nox/**", "/.hypothesis/**", "/.coverage", "/.coverage.*", "/htmlcov/**", "/lcov.info", "/junit.xml", "/*.profraw", "/*.profdata", "/*.egg-info/**", "/target/**", "/node_modules/**", "/dist/**", "/build/**", "/.cache/**", "/.pytest_cache/**", "/coverage/**"]
name = "zixcel-github"
version = "0.1.1"
edition = "2024"
rust-version = "1.97"
description = "Policy-neutral GitHub API wrapper boundary for Zixcel"
license = "Apache-2.0"
readme = "README.crate.md"
publish = ["crates-io"]
repository = "https://github.com/zixcel/zixcel-github"

[package.metadata.zixcel]
boundary = "github-api-wrapper"
external-actions = true

[workspace]
members = [".", "crates/*"]
resolver = "3"

[dependencies]
base64 = "0.23.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.1"
toml = "1.1.8"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
