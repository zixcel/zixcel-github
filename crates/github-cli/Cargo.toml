[package]
name = "zixcel-github-cli"
version = "0.2.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/zixcel/zixcel-github"
description = "Reviewed native github observations through the zix protocol"
publish = false
[[bin]]
name = "zix-github"
path = "src/main.rs"
[dependencies]
zix-native-provider = { git = "https://github.com/zixcel/cli", rev = "660af91c8b282398369d6bb77d0ece545b49cf34" }
[dev-dependencies]
serde_json = "1.0"
[lints.rust]
unsafe_code = "forbid"
[lints.clippy]
all = "warn"
